<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مخزون المستودع</title>
<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1f2a2e;--mu:#6b777b;--ac:#1d6f5f;--bd:#e2e0d9;--w:#b3402a}
@media(prefers-color-scheme:dark){:root{--bg:#15191a;--cd:#1f2527;--tx:#eceeed;--mu:#9aa6a9;--ac:#4cc2ab;--bd:#30393b;--w:#ef8a74}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,Arial,sans-serif;max-width:600px;margin-inline:auto}
h1{font-size:20px}input,button{font:inherit;font-size:16px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);margin-top:8px}
button.go{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:10px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px}
.q{font-size:22px;font-weight:800;color:var(--ac);white-space:nowrap}.q.low{color:var(--w)}
.t{font-size:12px;color:var(--mu)}.row{display:flex;gap:8px}.row input{flex:1}
.x{border:0;background:none;color:var(--mu);padding:6px}.msg{color:var(--ac);min-height:20px;margin-top:8px}
</style></head><body>
<h1>📦 مخزون المستودع</h1>
<div id="login" class="card" hidden>
 <div>أدخل كلمة السر</div><input id="key" type="password" autocomplete="current-password">
 <button class="go" onclick="login()">دخول</button><div class="msg" id="lm"></div></div>
<div id="app" hidden>
 <div id="edit" class="card" hidden>
  <b>تحديث كمية (للمستودع)</b>
  <input id="name" list="nl" placeholder="اسم المادة"><datalist id="nl"></datalist>
  <div class="row"><input id="qty" type="number" inputmode="decimal" placeholder="الكمية المتبقية"><input id="unit" placeholder="الوحدة"></div>
  <button class="go" onclick="save()">حفظ</button><div class="msg" id="msg"></div></div>
 <div class="row" style="margin-top:10px"><button class="go" id="b0" onclick="tab(0)">المخزون</button><button class="go" id="b1" onclick="tab(1)" style="opacity:.55">سجل التعديلات</button></div>
 <div id="sv"><input id="s" placeholder="ابحث عن مادة…" oninput="render()"><div id="list"></div></div>
 <div id="lv" hidden></div>
 <div class="t" style="margin-top:14px"><a href="#" onclick="logout();return false">تسجيل خروج</a></div>
</div>
<script>
var K=localStorage.getItem("k")||"",role=null,items=[];
function $(i){return document.getElementById(i)}
function api(m,p,b){return fetch(p,{method:m,headers:{"X-Key":K,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})}
function login(){K=$("key").value;api("GET","/api/me").then(function(r){if(r.ok){localStorage.setItem("k",K);start(r.j.role)}else $("lm").textContent="كلمة السر غير صحيحة"})}
function logout(){localStorage.removeItem("k");location.reload()}
function start(r){role=r;$("login").hidden=true;$("app").hidden=false;$("edit").hidden=r!=="warehouse";load();setInterval(load,5000)}
function load(){api("GET","/api/stock").then(function(r){if(r.ok){items=r.j;render()}});if(!$("lv").hidden)loadLog()}
function tab(n){$("sv").hidden=n===1;$("lv").hidden=n===0;$("b0").style.opacity=n===0?1:.55;$("b1").style.opacity=n===1?1:.55;if(n===1)loadLog()}
function loadLog(){api("GET","/api/log").then(function(r){if(r.ok)renderLog(r.j)})}
function renderLog(a){var b=$("lv");b.textContent="";if(!a.length){var e=document.createElement("div");e.className="t";e.style.cssText="text-align:center;padding:24px";e.textContent="لا توجد تعديلات بعد";b.appendChild(e)}
 a.forEach(function(x){var c=document.createElement("div");c.className="card";var n=document.createElement("b");n.textContent=x.name;
  var d=document.createElement("div");var u=" "+(x.unit||""),col="";
  if(x.type==="delete"){d.textContent="🗑 حُذفت المادة (كانت "+x.old+u+")";col="var(--w)"}
  else if(x.old===null){d.textContent="➕ مادة جديدة: "+x.qty+u;col="var(--ac)"}
  else{var df=Math.round((x.qty-x.old)*1000)/1000;
   if(df>0){d.textContent="⬆ زادت من "+x.old+" إلى "+x.qty+u+" (+"+df+")";col="var(--ac)"}
   else if(df<0){d.textContent="⬇ نقصت من "+x.old+" إلى "+x.qty+u+" ("+df+")";col="var(--w)"}
   else d.textContent="✔ تأكيد الكمية: "+x.qty+u}
  d.style.color=col;var t=document.createElement("div");t.className="t";t.textContent=new Date(x.ts*1000).toLocaleString("ar");
  c.appendChild(n);c.appendChild(d);c.appendChild(t);b.appendChild(c)})}
function ago(t){var m=Math.round((Date.now()/1000-t)/60);if(m<1)return"الآن";if(m<60)return"قبل "+m+" دقيقة";var h=Math.round(m/60);if(h<24)return"قبل "+h+" ساعة";return new Date(t*1000).toLocaleDateString("ar")}
function render(){var q=$("s").value.trim().toLowerCase(),b=$("list");b.textContent="";
 var a=items.filter(function(x){return!q||x.name.toLowerCase().indexOf(q)>-1});
 if(!a.length){var e=document.createElement("div");e.className="t";e.style.textAlign="center";e.style.padding="24px";e.textContent="لا توجد مواد";b.appendChild(e)}
 a.forEach(function(x){var c=document.createElement("div");c.className="card it";var l=document.createElement("div");
  var n=document.createElement("b");n.textContent=x.name;var t=document.createElement("div");t.className="t";t.textContent="آخر تحديث: "+ago(x.updated);
  l.appendChild(n);l.appendChild(t);var r=document.createElement("div");r.className="q"+(x.qty<=0?" low":"");r.textContent=x.qty+" "+(x.unit||"");
  c.appendChild(l);c.appendChild(r);
  if(role==="warehouse"){var d=document.createElement("button");d.className="x";d.textContent="حذف";d.onclick=function(){if(confirm("حذف "+x.name+"؟"))api("DELETE","/api/stock?name="+encodeURIComponent(x.name)).then(load)};c.appendChild(d)}
  b.appendChild(c)});
 var nl=$("nl");nl.textContent="";items.forEach(function(x){var o=document.createElement("option");o.value=x.name;nl.appendChild(o)})}
function save(){var n=$("name").value.trim(),q=parseFloat($("qty").value);if(!n||isNaN(q)){$("msg").textContent="اكتب المادة والكمية";return}
 api("POST","/api/stock",{name:n,qty:q,unit:$("unit").value}).then(function(r){$("msg").textContent=r.ok?"✓ تم الحفظ":r.j.error;if(r.ok){$("name").value=$("qty").value=$("unit").value="";load()}})}
$("name")&&($("name").onchange=function(){var x=items.filter(function(i){return i.name===$("name").value})[0];if(x){$("qty").value=x.qty;$("unit").value=x.unit||""}});
if(K)api("GET","/api/me").then(function(r){r.ok?start(r.j.role):($("login").hidden=false)});else $("login").hidden=false;
</script></body></html>
